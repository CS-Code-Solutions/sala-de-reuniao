<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Notificações</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../ico.png" type="image/png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .brand-logo { max-width: 150px; height: auto; }
    .nav-links a { display: flex; align-items: center; gap: 10px; }
    .nav-links svg { width: 18px; height: 18px; stroke-width: 2; }
    .user-profile-box { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border-color); }
    .user-info-text h4 { font-size: 14px; color: var(--text-main); }
    .user-info-text p { font-size: 12px; color: var(--text-muted); }
    .mobile-bottom-nav { display: none; }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-bottom-nav {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
        background: #ffffff; border-top: 1px solid var(--border-color); z-index: 1000;
      }
      .mob-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); text-decoration: none; gap: 4px; }
      .mob-nav-item.active { color: var(--primary); font-weight: 600; }
      .mob-nav-item svg { width: 20px; height: 20px; stroke-width: 2; }
      .main-content { padding-bottom: 72px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Notificações & Avisos</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Lembretes de reuniões próximas e comunicados do sistema</p>
      </div>
    </header>

    <section class="schedule-grid-container">
      <div class="time-slots" id="listaNotificacoes">
        <p style="color: var(--text-muted); font-size: 14px;">A verificar lembretes...</p>
      </div>
    </section>

    <footer style="text-align: center; padding: 16px; font-size: 12px; color: #64748b; margin-top: auto;">
      Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" style="color: #0d9488; text-decoration: none; font-weight: 600;">CS Code Solutions</a>
    </footer>
  </main>

  <div id="mobile-nav-container"></div>

  <script src="../js/sidebar.js"></script>
  <script src="../termos.js"></script>
  <script type="module">
    import { db } from "../js/firebase-config.js";
    import { verificarAutenticacao } from "../js/auth.js";
    import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    verificarAutenticacao((user) => {
      const container = document.getElementById("listaNotificacoes");
      const hoje = new Date();
      const hojeISO = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}-${String(hoje.getDate()).padStart(2, "0")}`;

      const q = query(collection(db, "reservas"), where("data", ">=", hojeISO));
      onSnapshot(q, (snapshot) => {
        const avisos = [];
        snapshot.forEach((docSnap) => {
          const r = docSnap.data();
          if (user.ehAdmin || r.userId === user.uid) {
            avisos.push(r);
          }
        });

        avisos.sort((a, b) => `${a.data} ${a.inicio}`.localeCompare(`${b.data} ${b.inicio}`));

        container.innerHTML = `
          <div class="slot-item disponivel">
            <div>
              <strong>Conformidade LGPD & Segurança Ativa</strong>
              <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Seu acesso está protegido e sincronizado via Firebase Cloud.</p>
            </div>
            <span style="font-size: 12px; color: #059669; font-weight: 600;">Sistema</span>
          </div>
        `;

        avisos.forEach((r) => {
          const dataBr = r.data.split("-").reverse().join("/");
          const item = document.createElement("div");
          item.className = "slot-item";
          item.style.borderLeft = "5px solid var(--primary)";
          item.innerHTML = `
            <div>
              <strong>Lembrete: ${r.titulo}</strong>
              <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
                Agendada para ${dataBr} das ${r.inicio} às ${r.fim} • ${r.sala || "Sala de Reuniões 01"}
              </p>
            </div>
            <span style="font-size: 12px; color: var(--primary); font-weight: 600;">Confirmada</span>
          `;
          container.appendChild(item);
        });
      });
    });
  </script>
</body>
</html>
