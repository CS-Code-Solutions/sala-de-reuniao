<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Display de Porta</title>
  <link rel="icon" href="../ico.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 48px;
      color: #ffffff;
      transition: background-color 0.5s ease;
      background-color: #065f46; /* Verde: Sala Livre */
    }
    body.ocupada { background-color: #991b1b; } /* Vermelho: Sala Ocupada */

    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .room-title { font-size: 36px; font-weight: 800; letter-spacing: -0.5px; }
    .clock-box { text-align: right; }
    .clock-time { font-size: 42px; font-weight: 700; }
    .clock-date { font-size: 16px; opacity: 0.85; }

    .status-center {
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      margin: 24px 0;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 24px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: rgba(255, 255, 255, 0.2);
      margin-bottom: 16px;
    }
    .meeting-name { font-size: 44px; font-weight: 800; margin-bottom: 12px; }
    .meeting-details { font-size: 22px; opacity: 0.9; }

    .quick-actions { display: flex; gap: 16px; justify-content: center; margin-top: 28px; }
    .btn-quick {
      padding: 16px 32px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: #ffffff;
      color: #065f46;
      transition: transform 0.15s;
    }
    .btn-quick:active { transform: scale(0.97); }

    .bottom-schedule {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 16px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div>
      <div class="room-title" id="displaySalaNome">Sala de Reuniões 01</div>
      <div style="opacity: 0.85; font-size: 15px; margin-top: 4px;">Painel Interativo de Porta • Sincronizado em Tempo Real</div>
    </div>
    <div class="clock-box">
      <div class="clock-time" id="relogioHora">--:--</div>
      <div class="clock-date" id="relogioData">Carregando data...</div>
    </div>
  </header>

  <main class="status-center">
    <div class="status-badge" id="statusBadge">DISPONÍVEL</div>
    <div class="meeting-name" id="reuniaoAtualTitulo">Sala Livre para Uso</div>
    <div class="meeting-details" id="reuniaoAtualDetalhes">Nenhuma reunião em andamento no momento.</div>

    <div class="quick-actions" id="acoesRapidas">
      <button class="btn-quick" onclick="reservaRapidaPorta(30)">Reservar Agora (30 min)</button>
      <button class="btn-quick" onclick="reservaRapidaPorta(60)">Reservar Agora (1 hora)</button>
    </div>
  </main>

  <footer class="bottom-schedule">
    <div id="proximaReuniaoInfo">Próxima reunião: Nenhuma prevista hoje</div>
    <div>Powered by <strong>CS Code Solutions</strong></div>
  </footer>

  <script type="module">
    import { db } from "../js/firebase-config.js";
    import {
      collection,
      query,
      where,
      onSnapshot,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const salaNome = params.get("sala") || "Sala de Reuniões 01";
    document.getElementById("displaySalaNome").innerText = salaNome;

    let reservasHoje = [];

    function dataISOAtual() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function toMin(hhmm) {
      const [h, m] = hhmm.split(":").map(Number);
      return h * 60 + m;
    }

    function atualizarRelogio() {
      const agora = new Date();
      document.getElementById("relogioHora").innerText = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      document.getElementById("relogioData").innerText = agora.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
      atualizarStatusSala();
    }

    function atualizarStatusSala() {
      const agora = new Date();
      const minAtual = agora.getHours() * 60 + agora.getMinutes();

      const emAndamento = reservasHoje.find((r) => minAtual >= toMin(r.inicio) && minAtual < toMin(r.fim));
      const proximas = reservasHoje
        .filter((r) => toMin(r.inicio) > minAtual)
        .sort((a, b) => toMin(a.inicio) - toMin(b.inicio));

      if (emAndamento) {
        document.body.classList.add("ocupada");
        document.getElementById("statusBadge").innerText = "OCUPADA";
        document.getElementById("reuniaoAtualTitulo").innerText = emAndamento.titulo;
        document.getElementById("reuniaoAtualDetalhes").innerText = `${emAndamento.inicio} às ${emAndamento.fim} • Responsável: ${emAndamento.responsavel || "Equipe"}`;
        document.getElementById("acoesRapidas").style.display = "none";
      } else {
        document.body.classList.remove("ocupada");
        document.getElementById("statusBadge").innerText = "DISPONÍVEL";
        document.getElementById("reuniaoAtualTitulo").innerText = "Sala Livre para Uso";
        document.getElementById("reuniaoAtualDetalhes").innerText = "Toque abaixo para iniciar uma reunião imediata.";
        document.getElementById("acoesRapidas").style.display = "flex";
      }

      if (proximas.length > 0) {
        const p = proximas[0];
        document.getElementById("proximaReuniaoInfo").innerText = `Próxima reunião: ${p.inicio} - ${p.fim} (${p.titulo})`;
      } else {
        document.getElementById("proximaReuniaoInfo").innerText = "Próxima reunião: Nenhuma prevista para o restante do dia";
      }
    }

    const q = query(collection(db, "reservas"), where("data", "==", dataISOAtual()));
    onSnapshot(q, (snap) => {
      reservasHoje = [];
      snap.forEach((docSnap) => {
        const item = docSnap.data();
        if ((item.sala || "Sala de Reuniões 01") === salaNome) {
          reservasHoje.push(item);
        }
      });
      atualizarStatusSala();
    });

    window.reservaRapidaPorta = async function (duracaoMin) {
      const agora = new Date();
      const fimDate = new Date(agora.getTime() + duracaoMin * 60000);
      const inicio = `${String(agora.getHours()).padStart(2, "0")}:${String(agora.getMinutes()).padStart(2, "0")}`;
      const fim = `${String(fimDate.getHours()).padStart(2, "0")}:${String(fimDate.getMinutes()).padStart(2, "0")}`;

      const conflito = reservasHoje.find((r) => toMin(inicio) < toMin(r.fim) && toMin(fim) > toMin(r.inicio));
      if (conflito) {
        alert(`Não é possível reservar ${duracaoMin} min pois há uma reunião agendada às ${conflito.inicio}.`);
        return;
      }

      try {
        await addDoc(collection(db, "reservas"), {
          titulo: "Reunião Rápida (Display de Porta)",
          data: dataISOAtual(),
          inicio,
          fim,
          sala: salaNome,
          tipo: "Rápida",
          cor: "purple",
          responsavel: "Painel da Sala",
          criadoEm: serverTimestamp()
        });
      } catch (err) {
        alert("Erro ao registrar reserva rápida: " + err.message);
      }
    };

    setInterval(atualizarRelogio, 10000);
    atualizarRelogio();
  </script>
</body>
</html>
