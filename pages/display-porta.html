<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="../ico.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Painel da Porta</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --green-status: #22c55e;
      --red-status: #ef4444;
      --accent: #0d9488;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Barra de rolagem customizada */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    body {
      background-color: var(--bg-dark);
      /* Suporte a imagem de fundo dinâmica */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      padding: 24px;
      position: relative;
      transition: background-image 0.5s ease-in-out;
    }

    /* Camada escura translúcida para garantir legibilidade sobre imagens de fundo */
    .bg-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.82);
      z-index: 1;
    }

    .display-container {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Coluna da Esquerda */
    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 20px;
      padding-top: 10vh;
    }

    .brand-logo-porta {
      max-height: 90px;
      width: auto;
      object-fit: contain;
    }

    .clock-box {
      display: flex;
      flex-direction: column;
    }

    .clock-time {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .clock-date {
      font-size: 18px;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: capitalize;
    }

    .room-title-box select, .room-title-box h2 {
      background: transparent;
      color: white;
      border: none;
      font-size: 28px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      padding: 0;
      margin: 0;
    }

    /* Coluna da Direita */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      overflow: hidden;
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }

    .status-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0; width: 8px;
      background: var(--green-status);
    }
    .status-card.ocupado::before { background: var(--red-status); }

    .status-info h2 { font-size: 28px; font-weight: 700; }
    .status-info p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .btn-reserva-rapida {
      background: var(--green-status);
      color: white; border: none; padding: 12px 20px;
      border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-reserva-rapida:hover { opacity: 0.9; transform: scale(1.02); }

    /* Lista de Reuniões do Dia */
    .schedule-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .schedule-box h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    #listaReunioesHoje {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .meeting-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .meeting-item:last-child { border-bottom: none; }

    .meeting-indicator { width: 4px; height: 28px; background: var(--accent); border-radius: 2px; }
    .meeting-details h4 { font-size: 15px; font-weight: 600; }
    .meeting-details p { font-size: 12px; color: var(--text-muted); }

    .meeting-item.concluida { opacity: 0.45; }
    .meeting-item.concluida .meeting-indicator { background: #64748b; }

    /* Seletor Rápido de Fundo (Flutuante Discreto no Canto Inferior Esquerdo) */
    .bg-switcher {
      position: fixed;
      bottom: 12px;
      left: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.85);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(4px);
    }
    .bg-switcher button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .bg-switcher button:hover { background: rgba(255,255,255,0.1); }
    .bg-switcher span { font-size: 11px; color: var(--text-muted); }

    /* Modal de Agendamento Rápido */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
      z-index: 2000; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-card {
      background: #1e293b; width: 100%; max-width: 480px; border-radius: 16px;
      padding: 24px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select {
      padding: 12px; background: #0f172a; border: 1px solid var(--border-color);
      border-radius: 8px; color: white; font-size: 14px; outline: none;
    }
    ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

    .quick-time-btns { display: flex; gap: 8px; }
    .btn-time-opt {
      flex: 1; padding: 10px; background: #0f172a; border: 1px solid var(--border-color);
      color: white; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .btn-time-opt.active { background: var(--accent); border-color: var(--accent); }

    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn-cancel {
      flex: 1; padding: 12px; background: rgba(255,255,255,0.1); color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    .btn-confirm {
      flex: 1; padding: 12px; background: var(--green-status); color: white;
      border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
    }

    /* Ajuste para teste no telemóvel na vertical */
    @media (max-width: 768px) {
      .display-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow-y: auto;
      }
      body { overflow-y: auto; height: auto; min-height: 100vh; }
      .left-col { justify-content: flex-start; align-items: center; text-align: center; gap: 16px; padding-top: 20px; }
      .brand-logo-porta { max-height: 65px; }
      .clock-time { font-size: 48px; }
      .status-card { padding: 15px; flex-direction: column; text-align: center; gap: 12px; }
      .status-card::before { width: 100%; height: 6px; top: 0; left: 0; }
      .btn-reserva-rapida { width: 100%; }
      .bg-switcher { bottom: 8px; left: 12px; right: 12px; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="bg-overlay" id="bgOverlay"></div>

  <!-- Seletor Rápido de Fundo (com setas para trocar para os lados) -->
  <div class="bg-switcher">
    <button onclick="mudarFundo(-1)" title="Fundo Anterior">&#10094;</button>
    <span id="nomeTemaAtual">Tema: Padrão</span>
    <button onclick="mudarFundo(1)" title="Próximo Fundo">&#10095;</button>
  </div>

  <div class="display-container">
    <!-- Coluna Esquerda -->
    <div class="left-col">
      <img src="../login.png" alt="Logo" class="brand-logo-porta">
      
      <div class="clock-box">
        <div class="clock-time" id="clockTime">12:00</div>
        <div class="clock-date" id="clockDate">segunda-feira, 26/10/2026</div>
      </div>

      <div class="room-title-box" id="containerSalaDisplay">
        <!-- Preenchido via JS -->
      </div>
    </div>

    <!-- Coluna Direita -->
    <div class="right-col">
      <div class="status-card" id="statusBanner">
        <div class="status-info">
          <h2 id="statusTexto">Disponível</h2>
          <p id="statusSubtexto">Sem reuniões a decorrer agora</p>
        </div>
        <button class="btn-reserva-rapida" onclick="abrirModalReservaRapida()">+ Reserva Rápida</button>
      </div>

      <div class="schedule-box">
        <h3>Próximas reuniões de hoje</h3>
        <div id="listaReunioesHoje">
          <!-- Itens carregados via script -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Reserva Rápida -->
  <div class="modal-overlay" id="modalReservaPorta">
    <div class="modal-card">
      <h3 style="font-size: 18px;">Nova Reserva na Porta</h3>

      <div class="form-group">
        <label>Selecione o Utilizador</label>
        <select id="selectUsuarioPorta">
          <!-- Carregado via JS -->
        </select>
      </div>

      <div class="form-group" style="display: flex; flex-direction: row; gap: 12px;">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px;">
          <label>Horário de Início</label>
          <input type="time" id="inputHoraInicioPorta" required>
        </div>
      </div>

      <div class="form-group">
        <label>Duração da Reunião</label>
        <div class="quick-time-btns">
          <button class="btn-time-opt active" onclick="selecionarDuracao(15, this)">15 min</button>
          <button class="btn-time-opt" onclick="selecionarDuracao(30, this)">30 min</button>
          <button class="btn-time-opt" onclick="selecionarDuracao(60, this)">1 hora</button>
        </div>
      </div>

      <div class="form-group">
        <label>Descrição / Título (Opcional)</label>
        <input type="text" id="inputTituloPorta" placeholder="Ex: Alinhamento rápido">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="document.getElementById('modalReservaPorta').style.display='none'">Cancelar</button>
        <button class="btn-confirm" onclick="confirmarReservaPorta()">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    let duracaoMinutos = 15;
    let salaAtualGlobal = "Sala 01";

    // Lista de fundos disponíveis (pode adicionar links de imagens da Unsplash ou locais)
    const temasFundo = [
      { nome: "Padrão Escuro", url: "", overlay: "rgba(15, 23, 42, 0.82)" },
      { nome: "Natureza / Folhas", url: "https://images.unsplash.com/photo-1542224566-6e85f2e6772f?auto=format&fit=crop&w=1920&q=80", overlay: "rgba(15, 23, 42, 0.75)" },
      { nome: "Escritório Moderno", url: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80", overlay: "rgba(15, 23, 42, 0.78)" },
      { nome: "Minimalista Cinza", url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80", overlay: "rgba(15, 23, 42, 0.80)" }
    ];
    let indiceTemaAtual = 0;

    document.addEventListener("DOMContentLoaded", () => {
      carregarTemaSalvo();
      inicializarSala();
      iniciarRelogio();
      carregarUsuariosDrop();
      atualizarPainel();
      setInterval(atualizarPainel, 10000);
    });

    function carregarTemaSalvo() {
      const salvo = localStorage.getItem("meetingroom_porta_tema");
      if (salvo !== null) {
        indiceTemaAtual = parseInt(salvo);
      }
      aplicarTemaAtual();
    }

    function mudarFundo(direcao) {
      indiceTemaAtual += direcao;
      if (indiceTemaAtual >= temasFundo.length) indiceTemaAtual = 0;
      if (indiceTemaAtual < 0) indiceTemaAtual = temasFundo.length - 1;

      localStorage.setItem("meetingroom_porta_tema", indiceTemaAtual);
      aplicarTemaAtual();
    }

    function aplicarTemaAtual() {
      const tema = temasFundo[indiceTemaAtual];
      document.getElementById("nomeTemaAtual").innerText = `Tema: ${tema.nome}`;
      
      if (tema.url === "") {
        document.body.style.backgroundImage = "none";
      } else {
        document.body.style.backgroundImage = `url('${tema.url}')`;
      }
      document.getElementById("bgOverlay").style.background = tema.overlay;
    }

    function inicializarSala() {
      const urlParams = new URLSearchParams(window.location.search);
      const salaParam = urlParams.get('sala');
      const container = document.getElementById("containerSalaDisplay");

      if (salaParam) {
        salaAtualGlobal = salaParam;
        container.innerHTML = `<h2>${salaAtualGlobal}</h2>`;
      } else {
        container.innerHTML = `
          <select id="selectSalaDisplay" onchange="mudarSalaUrl()" style="background: transparent; color: white; border: none; font-size: 28px; font-weight: 800; outline: none; cursor: pointer; padding:0; margin:0;">
            <option value="Sala 01" style="background:#0f172a;">Sala de Reuniões 01</option>
            <option value="Sala 02" style="background:#0f172a;">Sala de Reuniões 02</option>
          </select>
        `;
        document.getElementById("selectSalaDisplay").value = salaAtualGlobal;
      }
    }

    function mudarSalaUrl() {
      salaAtualGlobal = document.getElementById("selectSalaDisplay").value;
      atualizarPainel();
    }

    function iniciarRelogio() {
      const atualizar = () => {
        const agora = new Date();
        const horaStr = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const diaSemana = agora.toLocaleDateString('pt-BR', { weekday: 'long' });
        const dataStr = agora.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

        document.getElementById("clockTime").innerText = horaStr;
        document.getElementById("clockDate").innerText = `${diaSemana}, ${dataStr}`;
      };
      atualizar();
      setInterval(atualizar, 1000);
    }

    function carregarUsuariosDrop() {
      const select = document.getElementById("selectUsuarioPorta");
      const usuarios = JSON.parse(localStorage.getItem("meetingroom_usuarios")) || [
        { nome: "Programador", apelido: "Programador" },
        { nome: "Utilizador Teste", apelido: "Usuário" }
      ];

      select.innerHTML = "";
      usuarios.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u.apelido || u.nome.split(' ')[0];
        opt.innerText = `${u.nome} (${u.apelido || ''})`;
        select.appendChild(opt);
      });
    }

    function atualizarPainel() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('sala')) {
        salaAtualGlobal = urlParams.get('sala');
      } else {
        const sel = document.getElementById("selectSalaDisplay");
        if (sel) salaAtualGlobal = sel.value;
      }

      const reservas = JSON.parse(localStorage.getItem("meetingroom_reservas")) || [];
      const hojeStr = new Date().toISOString().split('T')[0];

      const reservasHoje = reservas.filter(r => r.sala === salaAtualGlobal && r.data === hojeStr);
      
      const agora = new Date();
      const horaAtualNum = agora.getHours() * 60 + agora.getMinutes();

      let emAndamento = null;

      reservasHoje.forEach(r => {
        const [hIni, mIni] = r.horarioInicio.split(':').map(Number);
        const [hFim, mFim] = (r.horarioFim || r.horarioInicio).split(':').map(Number);
        const minIni = hIni * 60 + mIni;
        const minFim = hFim * 60 + mFim;

        if (horaAtualNum >= minIni && horaAtualNum < minFim) {
          emAndamento = r;
        }
      });

      const banner = document.getElementById("statusBanner");
      const txtTitulo = document.getElementById("statusTexto");
      const txtSub = document.getElementById("statusSubtexto");

      if (emAndamento) {
        banner.classList.add("ocupado");
        txtTitulo.innerText = "Ocupado";
        txtSub.innerText = `${emAndamento.titulo} (${emAndamento.responsavel})`;
      } else {
        banner.classList.remove("ocupado");
        txtTitulo.innerText = "Disponível";
        txtSub.innerText = "Sem reuniões a decorrer agora";
      }

      const containerList = document.getElementById("listaReunioesHoje");
      containerList.innerHTML = "";

      if (reservasHoje.length === 0) {
        containerList.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">Nenhuma reunião agendada para hoje.</p>`;
      } else {
        reservasHoje.sort((a,b) => a.horarioInicio.localeCompare(b.horarioInicio)).forEach(r => {
          const [hFim, mFim] = (r.horarioFim || r.horarioInicio).split(':').map(Number);
          const minFim = hFim * 60 + mFim;
          const jaConcluida = horaAtualNum >= minFim;

          const div = document.createElement("div");
          div.className = `meeting-item ${jaConcluida ? 'concluida' : ''}`;
          div.innerHTML = `
            <div class="meeting-indicator"></div>
            <div class="meeting-details">
              <h4>${r.horarioInicio} - ${r.horarioFim || ''} | ${r.titulo} ${jaConcluida ? '<span style="font-size: 11px; color: #94a3b8; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; margin-left: 6px;">Concluída</span>' : ''}</h4>
              <p>Responsável: ${r.responsavel}</p>
            </div>
          `;
          containerList.appendChild(div);
        });
      }
    }

    function abrirModalReservaRapida() {
      const agora = new Date();
      const hh = String(agora.getHours()).padStart(2, '0');
      const mm = String(agora.getMinutes()).padStart(2, '0');
      document.getElementById("inputHoraInicioPorta").value = `${hh}:${mm}`;
      
      document.getElementById("modalReservaPorta").style.display = "flex";
    }

    function selecionarDuracao(minutos, btn) {
      duracaoMinutos = minutos;
      document.querySelectorAll(".btn-time-opt").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    function confirmarReservaPorta() {
      const responsavel = document.getElementById("selectUsuarioPorta").value;
      const horaSelecionada = document.getElementById("inputHoraInicioPorta").value;
      let titulo = document.getElementById("inputTituloPorta").value.trim();

      if (!horaSelecionada) {
        alert("Por favor, selecione o horário de início.");
        return;
      }
      if (!titulo) titulo = "Reunião Presencial";

      const [hIni, mIni] = horaSelecionada.split(':').map(Number);
      
      const agora = new Date();
      const dataFim = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate(), hIni, mIni + duracaoMinutos);
      
      const horaFimStr = dataFim.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const hojeStr = agora.toISOString().split('T')[0];

      const reservas = JSON.parse(localStorage.getItem("meetingroom_reservas")) || [];
      const novaReserva = {
        id: 'res-porta-' + Date.now(),
        titulo: titulo,
        horarioInicio: horaSelecionada,
        horarioFim: horaFimStr,
        sala: salaAtualGlobal,
        data: hojeStr,
        responsavel: responsavel,
        userId: 'porta'
      };

      reservas.push(novaReserva);
      localStorage.setItem("meetingroom_reservas", JSON.stringify(reservas));

      document.getElementById("modalReservaPorta").style.display = "none";
      document.getElementById("inputTituloPorta").value = "";

      atualizarPainel();
    }
  </script>
</body>
</html>
