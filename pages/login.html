<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Configurações para PWA e iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeetingRoom">
  <link rel="apple-touch-icon" href="ico.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/anti-flicker.js"></script>
  <title>MeetingRoom - Entrar</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="icon" href="ico.png" type="image/png">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('fundo.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      box-sizing: border-box;
    }
    .login-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }
    .form-group label {
      font-weight: 600;
      font-size: 13px;
      color: #334155;
    }
    .form-group input {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background: #1d4ed8;
    }
    .btn-login:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .erro-box {
      display: none;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
      text-align: left;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="login-card">
    <img src="login.png" alt="Logo MeetingRoom" class="login-logo">
    
    <div id="erroLoginBox" class="erro-box"></div>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="emailLogin" placeholder="seu.email@empresa.com" required onkeydown="if(event.key==='Enter') fazerLogin()">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senhaLogin" placeholder="••••••••" required onkeydown="if(event.key==='Enter') fazerLogin()">
    </div>
    <button class="btn-login" id="btnEntrar" onclick="fazerLogin()">Entrar</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDa9ztrK6VxFVeLbP0ge6-31V05gnztjJw",
      authDomain: "reuniao-d1b29.firebaseapp.com",
      projectId: "reuniao-d1b29",
      storageBucket: "reuniao-d1b29.firebasestorage.app",
      messagingSenderId: "887897617950",
      appId: "1:887897617950:web:e96cf3cce4792e7e2b600f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.replace("pages/calendar.html");
      } else {
        window.AntiFlicker?.reveal();
      }
    });

    function mostrarErroLogin(msg) {
      const box = document.getElementById("erroLoginBox");
      box.innerText = msg;
      box.style.display = "block";
    }

    async function fazerLogin() {
      const email = document.getElementById("emailLogin").value.trim().toLowerCase();
      const senha = document.getElementById("senhaLogin").value.trim();
      const btn = document.getElementById("btnEntrar");
      document.getElementById("erroLoginBox").style.display = "none";

      if (!email || !senha) {
        mostrarErroLogin("Por favor, preencha o e-mail e a senha.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "A entrar...";

      try {
        const cred = await firebase.auth().signInWithEmailAndPassword(email, senha);
        const user = cred.user;

        // Garante que existe registo do utilizador no Firestore
        const userRef = db.collection("usuarios").doc(user.uid);
        const docSnap = await userRef.get();
        if (!docSnap.exists) {
          const prefixo = email.split('@')[0];
          const ehAdmin = email.includes("admin") || email.includes("teste");
          await userRef.set({
            nome: prefixo.charAt(0).toUpperCase() + prefixo.slice(1),
            apelido: prefixo.charAt(0).toUpperCase() + prefixo.slice(1),
            email: email,
            cargo: ehAdmin ? "Administrador" : "Usuário",
            ativo: true
          });
        }

        window.location.href = "pages/calendar.html";
      } catch (error) {
        console.error("Erro no login:", error);
        let msg = "E-mail ou senha inválidos.";
        if (error.code === "auth/too-many-requests") {
          msg = "Muitas tentativas seguidas. Aguarde alguns minutos e tente novamente.";
        } else if (error.code === "auth/network-request-failed") {
          msg = "Sem ligação à internet. Verifique a sua rede.";
        }
        mostrarErroLogin(msg);
        btn.disabled = false;
        btn.innerText = "Entrar";
      }
    }
  </script>
</body>
</html>
