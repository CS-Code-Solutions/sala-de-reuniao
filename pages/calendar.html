<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Agenda</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="../ico.png" type="image/png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .brand-logo { max-width: 150px; height: auto; }
    .nav-links a { display: flex; align-items: center; gap: 10px; }
    .nav-links svg { width: 18px; height: 18px; stroke-width: 2; }
    .user-profile-box { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border-color); }
    .user-info-text h4 { font-size: 14px; color: var(--text-main); }
    .user-info-text p { font-size: 12px; color: var(--text-muted); }

    .cal-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 32px; background: #ffffff; border-bottom: 1px solid var(--border-color); }
    .date-nav { display: flex; align-items: center; gap: 8px; }
    .date-nav button { padding: 6px 12px; border: 1px solid var(--border-color); background: #f8fafc; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .view-toggles { display: flex; background: #f1f5f9; padding: 4px; border-radius: 8px; gap: 4px; }
    .view-toggles button { padding: 6px 14px; border: none; background: transparent; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .view-toggles button.active { background: #ffffff; color: var(--primary); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    .cal-layout { display: grid; grid-template-columns: 1fr 290px; gap: 24px; padding: 24px 32px; }
    .cal-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
    .cal-main-header { display: flex; justify-content: space-between; padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 14px; }

    .time-row { display: grid; grid-template-columns: 70px 1fr; border-bottom: 1px solid #f1f5f9; align-items: stretch; }
    .time-label { padding: 14px 12px; font-size: 12px; font-weight: 600; color: var(--text-muted); border-right: 1px solid #f1f5f9; text-align: right; }
    .event-block { margin: 6px 12px; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
    .event-block.green { background: #ecfdf5; border-left: 4px solid #10b981; color: #065f46; }
    .event-block.blue { background: #eff6ff; border-left: 4px solid #3b82f6; color: #1e40af; }
    .event-block.purple { background: #f5f3ff; border-left: 4px solid #8b5cf6; color: #5b21b6; }
    .event-time { font-weight: 600; font-size: 12px; }
    .event-title { font-weight: 700; margin-top: 2px; }
    .event-meta { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    .upcoming-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; align-items: flex-start; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: #3b82f6; flex-shrink: 0; }
    .up-info { display: flex; flex-direction: column; gap: 2px; }
    .up-time { font-size: 11px; font-weight: 600; color: var(--primary); }
    .up-title { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .up-meta { font-size: 11px; color: var(--text-muted); }

    /* Modal Nova Reserva */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.65); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; padding: 16px; }
    .modal-box { background: #ffffff; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .modal-box label { font-size: 12px; font-weight: 600; color: #334155; display: block; margin-bottom: 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }

    .mobile-bottom-nav { display: none; }
    @media (max-width: 960px) {
      .cal-layout { grid-template-columns: 1fr; padding: 16px; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .topbar { padding: 16px; }
      .cal-controls { padding: 12px 16px; }
      .mobile-bottom-nav {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
        background: #ffffff; border-top: 1px solid var(--border-color); z-index: 1000;
      }
      .mob-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); text-decoration: none; gap: 4px; }
      .mob-nav-item.active { color: var(--primary); font-weight: 600; }
      .mob-nav-item svg { width: 20px; height: 20px; stroke-width: 2; }
      .main-content { padding-bottom: 72px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Agenda de Salas</h1>
        <span id="userAvatarMobile" style="font-size: 12px; color: var(--text-muted);"></span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <select id="seletorSala" style="padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; background: #fff;">
          <option value="Sala de Reuniões 01">Sala de Reuniões 01</option>
          <option value="Sala Executiva 02">Sala Executiva 02</option>
        </select>
        <button onclick="abrirModalReserva('08:00', '09:00')" style="padding: 10px 18px; background: #0d9488; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">+ Nova Reserva</button>
      </div>
    </header>

    <div class="cal-controls">
      <div class="date-nav">
        <button onclick="mudarData(-1)">◀</button>
        <button onclick="resetarData()">Hoje</button>
        <button onclick="mudarData(1)">▶</button>
        <strong id="dataAtualExibicao" style="margin-left: 8px; font-size: 15px;"></strong>
      </div>

      <div class="view-toggles" id="viewTogglesGroup">
        <button class="active" onclick="mudarVisualizacao('dia', this)">Dia</button>
        <button onclick="mudarVisualizacao('semana', this)">Semana</button>
        <button onclick="mudarVisualizacao('mes', this)">Mês</button>
      </div>
    </div>

    <div class="cal-layout">
      <div class="cal-card">
        <div class="cal-main-header">
          <span>Sala de Reuniões 01</span>
          <span>Carregando...</span>
        </div>
        <div id="gridHorarios"></div>
      </div>

      <aside class="cal-card" style="padding: 18px; height: fit-content;">
        <h3 style="font-size: 15px; margin-bottom: 12px; color: var(--text-main);">Reservas do Dia</h3>
        <div id="listaProximas"></div>
      </aside>
    </div>

    <footer style="text-align: center; padding: 16px; font-size: 12px; color: #64748b; margin-top: auto;">
      Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" style="color: #0d9488; text-decoration: none; font-weight: 600;">CS Code Solutions</a>
    </footer>
  </main>

  <!-- Modal de Nova Reserva -->
  <div class="modal-overlay" id="modalNovaReserva">
    <div class="modal-box">
      <h3 style="font-size: 18px; color: #1e293b;">Agendar Reunião</h3>
      <div>
        <label>Título da Reunião</label>
        <input type="text" id="resTitulo" placeholder="Ex: Alinhamento Semanal">
      </div>
      <div>
        <label>Sala</label>
        <select id="resSala">
          <option value="Sala de Reuniões 01">Sala de Reuniões 01</option>
          <option value="Sala Executiva 02">Sala Executiva 02</option>
        </select>
      </div>
      <div>
        <label>Data</label>
        <input type="date" id="resData">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label>Início</label>
          <input type="time" id="resInicio" value="08:00">
        </div>
        <div>
          <label>Término</label>
          <input type="time" id="resFim" value="09:00">
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 8px;">
        <button onclick="document.getElementById('modalNovaReserva').style.display='none'" style="flex:1; padding: 10px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; cursor: pointer;">Cancelar</button>
        <button onclick="confirmarReservaModal()" style="flex:1; padding: 10px; border: none; background: #0d9488; color: white; font-weight: 600; border-radius: 8px; cursor: pointer;">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="mobile-nav-container"></div>

  <script src="../js/sidebar.js"></script>
  <script src="../termos.js"></script>
  <script type="module" src="../js/calendar.js"></script>
  <script>
    async function confirmarReservaModal() {
      const titulo = document.getElementById("resTitulo").value.trim();
      const sala = document.getElementById("resSala").value;
      const data = document.getElementById("resData").value;
      const inicio = document.getElementById("resInicio").value;
      const fim = document.getElementById("resFim").value;

      if (!titulo || !data || !inicio || !fim) {
        alert("Preencha todos os campos da reserva.");
        return;
      }

      const ok = await window.salvarReservaFirestore({ titulo, data, inicio, fim, sala });
      if (ok) {
        document.getElementById("resTitulo").value = "";
        document.getElementById("modalNovaReserva").style.display = "none";
      }
    }
  </script>
</body>
</html>
