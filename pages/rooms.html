<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Salas & Display de Porta</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../ico.png" type="image/png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .brand-logo { max-width: 150px; height: auto; }
    .nav-links a { display: flex; align-items: center; gap: 10px; }
    .nav-links svg { width: 18px; height: 18px; stroke-width: 2; }
    .user-profile-box { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border-color); }
    .user-info-text h4 { font-size: 14px; color: var(--text-main); }
    .user-info-text p { font-size: 12px; color: var(--text-muted); }
    .mobile-bottom-nav { display: none; }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-bottom-nav {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
        background: #ffffff; border-top: 1px solid var(--border-color); z-index: 1000;
      }
      .mob-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); text-decoration: none; gap: 4px; }
      .mob-nav-item.active { color: var(--primary); font-weight: 600; }
      .mob-nav-item svg { width: 20px; height: 20px; stroke-width: 2; }
      .main-content { padding-bottom: 72px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Salas & Display de Porta</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Gerencie as salas cadastradas e abra o painel interativo para tablets na porta</p>
      </div>
      <button onclick="cadastrarNovaSala()" style="padding: 10px 18px; background: #0d9488; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">+ Nova Sala</button>
    </header>

    <section class="schedule-grid-container">
      <div class="time-slots" id="listaSalas"></div>
    </section>

    <footer style="text-align: center; padding: 16px; font-size: 12px; color: #64748b; margin-top: auto;">
      Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" style="color: #0d9488; text-decoration: none; font-weight: 600;">CS Code Solutions</a>
    </footer>
  </main>

  <div id="mobile-nav-container"></div>

  <script src="../js/sidebar.js"></script>
  <script src="../termos.js"></script>
  <script type="module">
    import { db } from "../js/firebase-config.js";
    import { verificarAutenticacao } from "../js/auth.js";
    import { collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    verificarAutenticacao((user) => {
      if (!user.ehAdmin) return;

      const container = document.getElementById("listaSalas");
      onSnapshot(collection(db, "salas"), (snapshot) => {
        const salas = [];
        snapshot.forEach((d) => salas.push({ id: d.id, ...d.data() }));

        if (salas.length === 0) {
          salas.push(
            { id: "padrao-1", nome: "Sala de Reuniões 01", capacidade: 10, recursos: "TV 65\", Videoconferência, Quadro Branco", fixa: true },
            { id: "padrao-2", nome: "Sala Executiva 02", capacidade: 6, recursos: "Projetor HDMI, Ar-condicionado", fixa: true }
          );
        }

        container.innerHTML = "";
        salas.forEach((sala) => {
          const urlDisplay = `display-porta.html?sala=${encodeURIComponent(sala.nome)}`;
          const div = document.createElement("div");
          div.className = "slot-item disponivel";
          div.innerHTML = `
            <div>
              <strong>${sala.nome}</strong>
              <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
                Capacidade: ${sala.capacidade || 8} pessoas • ${sala.recursos || "Equipamento padrão"}
              </p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
              <a href="${urlDisplay}" target="_blank" style="padding: 8px 14px; background: #0f172a; color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 600;">Abrir Display de Porta</a>
              ${!sala.fixa ? `<button onclick="excluirSala('${sala.id}')" style="background: #fee2e2; color: #b91c1c;">Excluir</button>` : ""}
            </div>
          `;
          container.appendChild(div);
        });
      });
    });

    window.cadastrarNovaSala = async function () {
      const nome = prompt("Nome da nova sala (ex: Sala de Inovação 03):");
      if (!nome || !nome.trim()) return;

      const capacidade = prompt("Capacidade máxima de pessoas:", "8");
      const recursos = prompt("Recursos disponíveis (ex: TV, HDMI, Café):", "TV Smart, Wi-Fi");

      try {
        await addDoc(collection(db, "salas"), {
          nome: nome.trim(),
          capacidade: Number(capacidade) || 8,
          recursos: recursos || "Padrão"
        });
        alert("Sala cadastrada com sucesso!");
      } catch (e) {
        alert("Erro ao cadastrar sala: " + e.message);
      }
    };

    window.excluirSala = async function (id) {
      if (!confirm("Deseja remover esta sala?")) return;
      await deleteDoc(doc(db, "salas", id));
    };
  </script>
</body>
</html>
