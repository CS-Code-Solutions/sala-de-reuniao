  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDa9ztrK6VxFVeLbP0ge6-31V05gnztjJw",
      authDomain: "reuniao-d1b29.firebaseapp.com",
      projectId: "reuniao-d1b29",
      storageBucket: "reuniao-d1b29.firebasestorage.app",
      messagingSenderId: "887897617950",
      appId: "1:887897617950:web:e96cf3cce4792e7e2b600f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();

    // Correção: Aguarda a confirmação do Firebase Auth antes de pedir os dados ao Firestore
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        carregarUsuariosDoFirestore();
      }
    });

    function carregarUsuariosDoFirestore() {
      const container = document.getElementById("listaUtilizadores");
      if (!container) return;

      db.collection("usuarios").get().then((querySnapshot) => {
        container.innerHTML = "";
        if (querySnapshot.empty) {
          container.innerHTML = `<p style="color: #64748b; font-size: 14px;">Nenhum utilizador registado na nuvem ainda. Clique em "+ Novo Utilizador" para adicionar.</p>`;
          return;
        }

        querySnapshot.forEach((doc) => {
          const user = doc.data();
          const div = document.createElement("div");
          div.className = "user-card";
          div.innerHTML = `
            <div>
              <strong style="color: #1e293b; font-size: 15px;">${user.nome || 'Utilizador sem nome'}</strong>
              <p style="color: #64748b; font-size: 13px; margin-top: 2px;">${user.email || 'E-mail não registado'}</p>
            </div>
            <div class="user-actions">
              <span style="color: ${user.cargo === 'Administrador' ? 'var(--primary)' : '#64748b'}; font-weight: 600; font-size: 13px;">${user.cargo || 'Usuário'}</span>
            </div>
          `;
          container.appendChild(div);
        });
      }).catch((error) => {
        console.error("Erro ao carregar utilizadores:", error);
        container.innerHTML = `<p style="color: #ef4444; font-size: 14px;">Erro ao carregar da nuvem: ${error.message}</p>`;
      });
    }
    
    function atualizarSufixoEmail() {
      const cargo = document.getElementById("inputCargo").value;
      const labelSufixo = document.getElementById("labelSufixo");
      if (cargo === "Administrador") {
        labelSufixo.innerText = ".admin@viecelli.com";
      } else {
        labelSufixo.innerText = "@viecelli.com";
      }
    }

    function abrirModalUsuario() {
      document.getElementById("inputNome").value = "";
      document.getElementById("inputPrefixoEmail").value = "";
      document.getElementById("inputSenha").value = "";
      document.getElementById("inputCargo").value = "Usuário";
      atualizarSufixoEmail();
      document.getElementById("modalUsuario").style.display = "flex";
    }

    function fecharModalUsuario() {
      document.getElementById("modalUsuario").style.display = "none";
    }

    function salvarUtilizadorNoFirebase() {
      const nome = document.getElementById("inputNome").value.trim();
      const prefixo = document.getElementById("inputPrefixoEmail").value.trim().toLowerCase();
      const cargo = document.getElementById("inputCargo").value;
      const senha = document.getElementById("inputSenha").value.trim();

      if (!nome || !prefixo || !senha) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      const sufixo = cargo === "Administrador" ? ".admin@viecelli.com" : "@viecelli.com";
      const emailCompleto = prefixo + sufixo;

      // Criação direta e segura utilizando a auth principal
      firebase.auth().createUserWithEmailAndPassword(emailCompleto, senha)
        .then((userCredential) => {
          const uid = userCredential.user.uid;
          
          return db.collection("usuarios").doc(uid).set({
            nome: nome,
            email: emailCompleto,
            cargo: cargo,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
        .then(() => {
          alert(`Utilizador "${nome}" (${emailCompleto}) criado com sucesso!`);
          fecharModalUsuario();
          carregarUsuariosDoFirestore();
        })
        .catch((error) => {
          console.error("Erro ao criar utilizador:", error);
          alert("Erro ao criar utilizador: " + error.message);
        });
    }
  </script>
