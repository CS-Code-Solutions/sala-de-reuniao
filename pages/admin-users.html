<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Administração de Usuários</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../ico.png" type="image/png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .brand-logo { max-width: 150px; height: auto; }
    .nav-links a { display: flex; align-items: center; gap: 10px; }
    .nav-links svg { width: 18px; height: 18px; stroke-width: 2; }
    .user-profile-box { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border-color); }
    .user-info-text h4 { font-size: 14px; color: var(--text-main); }
    .user-info-text p { font-size: 12px; color: var(--text-muted); }
    .mobile-bottom-nav { display: none; }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-bottom-nav {
        display: flex; justify-content: space-around; align-items: center;
        position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
        background: #ffffff; border-top: 1px solid var(--border-color); z-index: 1000;
      }
      .mob-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); text-decoration: none; gap: 4px; }
      .mob-nav-item.active { color: var(--primary); font-weight: 600; }
      .mob-nav-item svg { width: 20px; height: 20px; stroke-width: 2; }
      .main-content { padding-bottom: 72px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Usuários & Permissões</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Gerencie cargos e acessos registrados no Firebase</p>
      </div>
      <button onclick="abrirModalNovoUsuario()" style="padding: 10px 18px; background: #0d9488; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">+ Novo Usuário</button>
    </header>

    <section class="schedule-grid-container">
      <div class="time-slots" id="listaUtilizadores"></div>
    </section>

    <footer style="text-align: center; padding: 16px; font-size: 12px; color: #64748b; margin-top: auto;">
      Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" style="color: #0d9488; text-decoration: none; font-weight: 600;">CS Code Solutions</a>
    </footer>
  </main>

  <div id="mobile-nav-container"></div>

  <script src="../js/sidebar.js"></script>
  <script src="../termos.js"></script>
  <script type="module" src="../js/users.js"></script>
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { db } from "../js/firebase-config.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDa9ztrK6VxFVeLbP0ge6-31V05gnztjJw",
      authDomain: "reuniao-d1b29.firebaseapp.com",
      projectId: "reuniao-d1b29",
      storageBucket: "reuniao-d1b29.firebasestorage.app",
      messagingSenderId: "887897617950",
      appId: "1:887897617950:web:e96cf3cce4792e7e2b600f"
    };

    // Instância secundária para criar usuário no Auth sem deslogar o administrador atual
    const secondaryApp = getApps().find(a => a.name === "Secondary") || initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondaryApp);

    window.abrirModalNovoUsuario = async function () {
      const nome = prompt("Nome completo do novo usuário:");
      if (!nome || !nome.trim()) return;

      const email = prompt("E-mail corporativo:");
      if (!email || !email.trim()) return;

      const senha = prompt("Senha inicial (mínimo 6 caracteres):", "123456");
      if (!senha || senha.length < 6) {
        alert("A senha deve ter pelo menos 6 caracteres.");
        return;
      }

      const tipo = prompt("Cargo (1 = Usuário, 2 = Administrador, 3 = Recepcionista):", "1");
      let cargo = "Usuário";
      if (tipo === "2") cargo = "Administrador";
      if (tipo === "3") cargo = "Recepcionista";

      try {
        const cred = await createUserWithEmailAndPassword(secondaryAuth, email.trim().toLowerCase(), senha);
        await setDoc(doc(db, "usuarios", cred.user.uid), {
          uid: cred.user.uid,
          nome: nome.trim(),
          apelido: nome.trim().split(" ")[0],
          email: email.trim().toLowerCase(),
          cargo,
          criadoEm: serverTimestamp()
        });
        await secondaryAuth.signOut();
        alert(`Usuário ${nome} (${cargo}) cadastrado com sucesso!`);
      } catch (error) {
        console.error("Erro ao criar usuário:", error);
        alert("Erro ao cadastrar usuário: " + error.message);
      }
    };
  </script>
</body>
</html>
