<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Administração de Utilizadores</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../ico.png" type="image/png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .brand-logo { max-width: 150px; height: auto; }
    .nav-links a { display: flex; align-items: center; gap: 10px; }
    .nav-links svg { width: 18px; height: 18px; stroke-width: 2; }
    .user-profile-box { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border-color); }
    .user-info-text h4 { font-size: 14px; color: var(--text-main); }
    .user-info-text p { font-size: 12px; color: var(--text-muted); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.65); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; padding: 16px; }
    .modal-box { background: #ffffff; width: 100%; max-width: 440px; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .modal-box label { font-size: 12px; font-weight: 600; color: #334155; display: block; margin-bottom: 4px; }
    .modal-box input, .modal-box select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }

    .mobile-bottom-nav { display: none; }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-bottom-nav { display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: #ffffff; border-top: 1px solid var(--border-color); z-index: 1000; }
      .mob-nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); text-decoration: none; gap: 4px; }
      .mob-nav-item.active { color: var(--primary); font-weight: 600; }
      .mob-nav-item svg { width: 20px; height: 20px; stroke-width: 2; }
      .main-content { padding-bottom: 72px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Utilizadores & Permissões</h1>
        <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Gerencie cargos, apelidos e WhatsApp para negociação de salas</p>
      </div>
      <button onclick="abrirModalNovoUsuario()" style="padding: 10px 18px; background: #0d9488; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">+ Novo Utilizador</button>
    </header>

    <section class="schedule-grid-container">
      <div class="time-slots" id="listaUtilizadores"></div>
    </section>

    <footer style="text-align: center; padding: 16px; font-size: 12px; color: #64748b; margin-top: auto;">
      Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" style="color: #0d9488; text-decoration: none; font-weight: 600;">CS Code Solutions</a>
    </footer>
  </main>

  <!-- Modal Cadastro de Utilizador -->
  <div class="modal-overlay" id="modalNovoUsuario">
    <div class="modal-box">
      <h3 style="font-size: 18px; color: #1e293b;">Novo Utilizador</h3>
      <div>
        <label>Nome Completo</label>
        <input type="text" id="usrNome" placeholder="Ex: João Silva">
      </div>
      <div>
        <label>Apelido (Exibição na agenda)</label>
        <input type="text" id="usrApelido" placeholder="Ex: João">
      </div>
      <div>
        <label>WhatsApp (DDI + DDD + Número)</label>
        <input type="text" id="usrWhatsapp" placeholder="Ex: 5551999999999">
      </div>
      <div>
        <label>Cargo</label>
        <select id="usrCargo" onchange="document.getElementById('sufixoEmail').innerText = this.value === 'Administrador' ? '.admin@viecelli.com' : '@viecelli.com'">
          <option value="Usuário">Usuário Comum</option>
          <option value="Administrador">Administrador</option>
        </select>
      </div>
      <div>
        <label>E-mail Corporativo</label>
        <div style="display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden;">
          <input type="text" id="usrPrefixo" placeholder="joao.silva" style="border: none; flex: 1;">
          <span id="sufixoEmail" style="background: #f1f5f9; padding: 10px; font-size: 12px; color: #64748b; font-weight: 600;">@viecelli.com</span>
        </div>
      </div>
      <div>
        <label>Senha Inicial</label>
        <input type="password" id="usrSenha" placeholder="Mínimo 6 caracteres">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 8px;">
        <button onclick="document.getElementById('modalNovoUsuario').style.display='none'" style="flex:1; padding: 10px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; cursor: pointer;">Cancelar</button>
        <button onclick="criarUsuarioFirebase()" style="flex:1; padding: 10px; border: none; background: #0d9488; color: white; font-weight: 600; border-radius: 8px; cursor: pointer;">Guardar</button>
      </div>
    </div>
  </div>

  <div id="mobile-nav-container"></div>

  <script src="../js/sidebar.js"></script>
  <script src="../termos.js"></script>
  <script type="module" src="../js/users.js"></script>
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { db } from "../js/firebase-config.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDa9ztrK6VxFVeLbP0ge6-31V05gnztjJw",
      authDomain: "reuniao-d1b29.firebaseapp.com",
      projectId: "reuniao-d1b29",
      storageBucket: "reuniao-d1b29.firebasestorage.app",
      messagingSenderId: "887897617950",
      appId: "1:887897617950:web:e96cf3cce4792e7e2b600f"
    };

    const secondaryApp = getApps().find(a => a.name === "Secondary") || initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondaryApp);

    window.abrirModalNovoUsuario = function () {
      document.getElementById("modalNovoUsuario").style.display = "flex";
    };

    window.criarUsuarioFirebase = async function () {
      const nome = document.getElementById("usrNome").value.trim();
      const apelido = document.getElementById("usrApelido").value.trim() || nome.split(" ")[0];
      const whatsapp = document.getElementById("usrWhatsapp").value.trim();
      const cargo = document.getElementById("usrCargo").value;
      const prefixo = document.getElementById("usrPrefixo").value.trim().toLowerCase();
      const senha = document.getElementById("usrSenha").value.trim();

      if (!nome || !prefixo || senha.length < 6) {
        alert("Preencha o nome, o prefixo do e-mail e uma senha de pelo menos 6 caracteres.");
        return;
      }

      const sufixo = cargo === "Administrador" ? ".admin@viecelli.com" : "@viecelli.com";
      const emailCompleto = prefixo + sufixo;

      try {
        const cred = await createUserWithEmailAndPassword(secondaryAuth, emailCompleto, senha);
        await setDoc(doc(db, "usuarios", cred.user.uid), {
          uid: cred.user.uid,
          nome,
          apelido,
          whatsapp,
          email: emailCompleto,
          cargo,
          notificacoes: { email: true, tempoAntecedencia: 10 },
          criadoEm: serverTimestamp()
        });
        await secondaryAuth.signOut();
        document.getElementById("modalNovoUsuario").style.display = "none";
        alert(`Utilizador ${nome} (${cargo}) criado com sucesso!`);
      } catch (error) {
        alert("Erro ao criar utilizador: " + error.message);
      }
    };
  </script>
</body>
</html>
