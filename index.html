<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Entrar</title>
  <link rel="icon" href="ico.png" type="image/png">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      background-image: url('fundo.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .login-card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      text-align: center;
      box-sizing: border-box;
      /* Borda inicial sutil e transição suave */
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease-in-out;
    }
    /* Efeito de brilho dourado ao passar o rato ou o dedo por cima */
    .login-card:hover {
      border-color: #d4af37;
      box-shadow: 0 20px 40px rgba(212, 175, 55, 0.35);
    }
    .login-logo {
      max-width: 160px;
      max-height: 75px;
      width: auto;
      height: auto;
      margin-bottom: 24px;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }
    .form-group label {
      font-weight: 600;
      font-size: 12px;
      color: #334155;
      letter-spacing: 0.3px;
    }
    .form-group input {
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      background: #f8fafc;
    }
    .form-group input:hover {
      border-color: #94a3b8;
    }
    .form-group input:focus {
      background: #ffffff;
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover {
      background: #0f766e;
    }
    .btn-login:active {
      transform: scale(0.98);
    }
    .login-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
    }
    .login-footer p {
      font-size: 11px;
      color: #64748b;
      margin: 0;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="login-card">
    <img src="login.png" alt="MeetingRoom" class="login-logo" onerror="this.onerror=function(){this.style.display='none'; document.getElementById('fallback-title').style.display='block';}; this.src='cabe.png';">
    <h2 id="fallback-title" style="display:none; color: #1e293b; margin-bottom: 24px; font-size: 22px;">MeetingRoom</h2>
    
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="emailLogin" placeholder="seu.email@empresa.com" required>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senhaLogin" placeholder="••••••••" required>
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>

    <div class="login-footer">
      <p>&copy; 2026 Viecelli | Powered by <strong>CS Code Solutions</strong></p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDa9ztrK6VxFVeLbP0ge6-31V05gnztjJw",
      authDomain: "reuniao-d1b29.firebaseapp.com",
      projectId: "reuniao-d1b29",
      storageBucket: "reuniao-d1b29.firebasestorage.app",
      messagingSenderId: "887897617950",
      appId: "1:887897617950:web:e96cf3cce4792e7e2b600f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    function fazerLogin() {
      const email = document.getElementById("emailLogin").value.trim();
      const senha = document.getElementById("senhaLogin").value.trim();

      if (!email || !senha) {
        alert("Por favor, preencha o e-mail e a senha.");
        return;
      }

      firebase.auth().signInWithEmailAndPassword(email, senha)
        .then(() => {
          window.location.href = "pages/calendar.html";
        })
        .catch((error) => {
          console.error("Erro no login:", error);
          alert("Erro ao entrar (" + error.code + "): " + error.message);
        });
    }
  </script>
</body>
</html>
