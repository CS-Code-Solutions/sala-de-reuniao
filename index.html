<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Entrar</title>
  <link rel="icon" href="ico.png" type="image/png">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Fundo direto usando o caminho relativo exato da raiz */
      background-color: #0f172a;
      background-image: url('fundo.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .login-logo {
      max-width: 180px;
      max-height: 80px;
      width: auto;
      height: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }
    .form-group label {
      font-weight: 600;
      font-size: 13px;
      color: #334155;
    }
    .form-group input {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-login:hover {
      background: #1d4ed8;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="login-card">
    <!-- Logótipo puxando explicitamente da raiz -->
    <img src="./login.png" alt="MeetingRoom" class="login-logo" onerror="this.onerror=function(){this.style.display='none'; document.getElementById('fallback-title').style.display='block';}; this.src='cabe.png';">
    <h2 id="fallback-title" style="display:none; color: #1e293b; margin-bottom: 24px; font-size: 22px;">MeetingRoom</h2>
    
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="emailLogin" placeholder="seu.email@empresa.com" required>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senhaLogin" placeholder="••••••••" required>
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDa9ztrK6VxFVeLbP0ge6-31V05gnztjJw",
      authDomain: "reuniao-d1b29.firebaseapp.com",
      projectId: "reuniao-d1b29",
      storageBucket: "reuniao-d1b29.firebasestorage.app",
      messagingSenderId: "887897617950",
      appId: "1:887897617950:web:e96cf3cce4792e7e2b600f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    function fazerLogin() {
      const email = document.getElementById("emailLogin").value.trim();
      const senha = document.getElementById("senhaLogin").value.trim();

      if (!email || !senha) {
        alert("Por favor, preencha o e-mail e a senha.");
        return;
      }

      firebase.auth().signInWithEmailAndPassword(email, senha)
        .then(() => {
          // Redirecionamento correto e sem duplicação para a pasta pages
          window.location.href = "pages/calendar.html";
        })
        .catch((error) => {
          console.error("Erro no login:", error);
          alert("Erro ao entrar (" + error.code + "): " + error.message);
        });
    }
  </script>
</body>
</html>
