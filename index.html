<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Entrar</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="icon" href="ico.png" type="image/png">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('fundo.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 32px 28px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
      box-sizing: border-box;
    }
    .login-logo {
      max-width: 150px;
      height: auto;
      margin-bottom: 20px;
      object-fit: contain;
    }
    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }
    .form-group label {
      font-weight: 600;
      font-size: 12px;
      color: #334155;
      letter-spacing: 0.3px;
    }
    .form-group input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      background: #ffffff;
    }
    .form-group input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    .btn-login {
      width: 100%;
      padding: 11px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease;
    }
    .btn-login:hover {
      background: #0f766e;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="login-card">
    <!-- Logótipo fixo exclusivamente como login.png -->
    <img src="login.png" alt="Logo MeetingRoom" class="login-logo">
    
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="emailLogin" placeholder="seu.email@empresa.com" required>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senhaLogin" placeholder="••••••••" required>
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDa9ztrK6VxFVeLbP0ge6-31V05gnztjJw",
      authDomain: "reuniao-d1b29.firebaseapp.com",
      projectId: "reuniao-d1b29",
      storageBucket: "reuniao-d1b29.firebasestorage.app",
      messagingSenderId: "887897617950",
      appId: "1:887897617950:web:e96cf3cce4792e7e2b600f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    function fazerLogin() {
      const email = document.getElementById("emailLogin").value.trim();
      const senha = document.getElementById("senhaLogin").value.trim();

      if (!email || !senha) {
        alert("Por favor, preencha o e-mail e a senha.");
        return;
      }

      firebase.auth().signInWithEmailAndPassword(email, senha)
        .then(() => {
          window.location.href = "pages/calendar.html";
        })
        .catch((error) => {
          console.error("Erro no login:", error);
          alert("Erro ao entrar (" + error.code + "): " + error.message);
        });
    }
  </script>
</body>
</html>
