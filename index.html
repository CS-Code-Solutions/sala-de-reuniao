<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Configurações para PWA e iOS -->
<link rel="manifest" href="../manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MeetingRoom">
<link rel="apple-touch-icon" href="../ico.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingRoom - Entrar</title>
  <link rel="icon" href="ico.png" type="image/png">
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      background-image: url('fundo.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .login-card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      text-align: center;
      box-sizing: border-box;
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease-in-out;
    }
    .login-card:hover {
      border-color: #d4af37;
      box-shadow: 0 20px 40px rgba(212, 175, 55, 0.35);
    }
    .login-logo {
      max-width: 160px;
      max-height: 75px;
      width: auto;
      height: auto;
      margin-bottom: 24px;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }
    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }
    .form-group label {
      font-weight: 600;
      font-size: 12px;
      color: #334155;
      letter-spacing: 0.3px;
    }
    .form-group input {
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      background: #f8fafc;
    }
    .form-group input:hover {
      border-color: #94a3b8;
    }
    .form-group input:focus {
      background: #ffffff;
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover {
      background: #0f766e;
    }
    .btn-login:active {
      transform: scale(0.98);
    }
    .login-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
    }
    .login-footer p {
      font-size: 11px;
      color: #64748b;
      margin: 0;
    }
    .demo-credentials {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 6px;
      text-align: left;
    }

    /* Estilos do Modal Personalizado */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-alert-card {
      background: white;
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
    }
    .btn-modal-ok {
      width: 100%;
      padding: 10px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-modal-ok:hover {
      background: #0f766e;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="login.png" alt="MeetingRoom" class="login-logo" onerror="this.src='cabe.png';">
    
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="emailLogin" placeholder="seu.email@empresa.com" required>
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="senhaLogin" placeholder="••••••••" required>
    </div>
    <button class="btn-login" onclick="fazerLoginLocal()">Entrar</button>

    <div class="demo-credentials">
      <b>Acessos Demo:</b><br>
      Admin: <code>admin@viecelli.com</code> / <code>123456</code><br>
      User: <code>usuario@viecelli.com</code> / <code>123456</code>
    </div>

    <div class="login-footer">
      <p>&copy; 2026 Viecelli | Powered by <strong>CS Code Solutions</strong></p>
    </div>
  </div>

  <!-- Modal de Alerta Personalizado -->
  <div class="modal-overlay" id="modalAlertaLogin">
    <div class="modal-alert-card">
      <div style="font-size: 32px;" id="modalAlertaIcone">⚠️</div>
      <h3 class="modal-title" id="modalAlertaTitulo">Atenção</h3>
      <p style="font-size: 14px; color: #64748b; line-height: 1.5; margin: 0;" id="modalAlertaTexto">Mensagem aqui</p>
      <button class="btn-modal-ok" onclick="document.getElementById('modalAlertaLogin').style.display='none'">OK</button>
    </div>
  </div>

  <script>
    function inicializarBancoLocal() {
      let usuarios = JSON.parse(localStorage.getItem("meetingroom_usuarios")) || [];

      const adminPadrao = { uid: "admin-1", email: "admin@viecelli.com", senha: "123456", nome: "Administrador", apelido: "Programador", cargo: "Administrador", whatsapp: "5551981061618" };
      const userPadrao = { uid: "user-1", email: "usuario@viecelli.com", senha: "123456", nome: "Utilizador Teste", apelido: "Usuário", cargo: "Usuário", whatsapp: "5551981061618" };

      let idxAdmin = usuarios.findIndex(u => u.email === adminPadrao.email);
      if (idxAdmin >= 0) { usuarios[idxAdmin].apelido = "Programador"; } else { usuarios.push(adminPadrao); }

      let idxUser = usuarios.findIndex(u => u.email === userPadrao.email);
      if (idxUser >= 0) { usuarios[idxUser].apelido = "Usuário"; } else { usuarios.push(userPadrao); }

      localStorage.setItem("meetingroom_usuarios", JSON.stringify(usuarios));

      if (!localStorage.getItem("meetingroom_reservas")) {
        localStorage.setItem("meetingroom_reservas", JSON.stringify([]));
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      inicializarBancoLocal();
    });

    function mostrarAlertaLogin(titulo, texto, icone = "⚠️") {
      document.getElementById("modalAlertaTitulo").innerText = titulo;
      document.getElementById("modalAlertaTexto").innerText = texto;
      document.getElementById("modalAlertaIcone").innerText = icone;
      document.getElementById("modalAlertaLogin").style.display = "flex";
    }

    function fazerLoginLocal() {
      const email = document.getElementById("emailLogin").value.trim().toLowerCase();
      const senha = document.getElementById("senhaLogin").value.trim();

      if (!email || !senha) {
        mostrarAlertaLogin("Atenção", "Por favor, preencha o e-mail e a senha.", "⚠️");
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem("meetingroom_usuarios")) || [];
      const userEncontrado = usuarios.find(u => u.email.toLowerCase() === email && u.senha === senha);

      if (userEncontrado) {
        localStorage.setItem("meetingroom_sessao_atual", JSON.stringify(userEncontrado));
        window.location.href = "pages/calendar.html";
      } else {
        mostrarAlertaLogin("Erro no Acesso", "E-mail ou senha incorretos.", "❌");
      }
    }
  </script>
</body>
</html>
